<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#263957"><link rel="manifest" href="manifest.webmanifest"><title>アルティメットプランナー極み</title><link rel="stylesheet" href="style.css"></head><body><header><h1>アルティメットプランナー極み</h1><div class="actions"><button id="prev">‹ 前週</button><button id="today">今週</button><button id="next">翌週 ›</button><button id="add">＋ 予定</button><button id="settings">同期設定</button></div></header><main><div id="status" role="status"></div><h2 id="weekLabel"></h2><div class="calendar-scroll"><div id="calendar"></div></div><section><h2>今週の予定</h2><div id="agenda"></div></section></main><dialog id="editor"><form id="eventForm"><h2 id="editorTitle">予定を登録</h2><label>タイトル<input name="title" required maxlength="120"></label><label>種類<select name="category"><option>授業</option><option>バイト</option><option>課題</option><option>就活</option><option>その他</option></select></label><label>開始<input name="start" type="datetime-local" required></label><label>終了<input name="end" type="datetime-local" required></label><label class="check"><input name="weekly" type="checkbox">毎週同じ曜日・時間に繰り返す</label><label>メモ<textarea name="note" rows="3"></textarea></label><div class="actions"><button type="button" id="remove" class="danger">削除</button><button type="button" id="cancel">キャンセル</button><button type="submit" class="primary">保存</button></div></form></dialog><dialog id="cloudDialog"><form id="cloudForm"><h2>端末間の同期</h2><p>Android版と同じFirebaseプロジェクトを使用します。未設定でも、このブラウザ内に予定を保存できます。</p><label>Firebase Project ID<input name="project" autocomplete="off" required></label><label>Firebase Web API Key<input name="key" autocomplete="off" required></label><label>メールアドレス<input name="email" type="email" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><div class="actions"><button type="button" id="cloudCancel">閉じる</button><button type="button" id="logout">ログアウト</button><button type="button" id="signup">新規登録</button><button type="submit" class="primary">ログイン・同期</button></div><button type="button" id="syncNow">今すぐ同期</button></form></dialog><script type="module" src="app.js"></script></body></html>
