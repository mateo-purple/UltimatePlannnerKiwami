name: Test Web and Android
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/tests/*.test.mjs
      - run: node --check docs/app.js && node --check docs/core.js && node --check docs/sync.js && node --check docs/firebase-config.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          allow-snapshot-wrappers: true
          validate-wrappers: false
      - run: gradle :app:assembleDebug --no-daemon
      - name: Test Japanese date/OCR parser
        run: |
          mkdir -p "$RUNNER_TEMP/kiwami-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/kiwami-tests" app/src/main/java/jp/ultimateplanner/kiwami/TimeUtil.java app/src/main/java/jp/ultimateplanner/kiwami/ImportParser.java tests/ImportParserTest.java
          java -cp "$RUNNER_TEMP/kiwami-tests" jp.ultimateplanner.kiwami.ImportParserTest
      - name: Package downloadable Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: UltimatePlannerKiwami-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30