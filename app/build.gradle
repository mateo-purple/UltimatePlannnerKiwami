plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.ultimateplanner.kiwami'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.ultimateplanner.kiwami'
        minSdk 26
        targetSdk 34
        versionCode 20261119
        versionName '1.5.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // 同梱型ML Kit。認識処理は端末上で実行されます。
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
}